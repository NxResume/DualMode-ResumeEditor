name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install
        run: pnpm install

      - name: Lint
        run: pnpm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install
        run: pnpm install

      - name: prisma generate
        # CI 没有 .env；generate 只需 schema 解析通过，不需要真实连库，
        # 给个占位 DATABASE_URL 即可（Prisma 6 要求 env 存在）
        run: npx prisma generate
        env:
          DATABASE_URL: 'mysql://user:pass@localhost:3306/dummy'

      - name: Typecheck
        run: pnpm run typecheck
